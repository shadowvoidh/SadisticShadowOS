name: Build Kernel & ISO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o Código
      uses: actions/checkout@v4

    - name: Instalar Ferramentas
      run: |
        sudo apt update
        sudo apt install -y nasm build-essential gcc-multilib g++-multilib xorriso grub-pc-bin

    - name: Compilar o Kernel e Gerar a ISO
      run: |
        # 1. Cria a pasta build
        mkdir -p build

        # 2. Compila os arquivos fonte de src/
        nasm -f elf32 src/boot.asm -o build/boot.o
        g++ -m32 -c src/kernel.cpp -o build/kernel.o -ffreestanding -O2 -Wall -Wextra -fno-exceptions -fno-rtti

        # 3. Linka usando o linker.ld da raiz
        ld -m elf_i386 -T linker.ld build/boot.o build/kernel.o -o build/SSos.bin

        # 4. Prepara e gera a ISO
        cp build/SSos.bin iso/boot/SSos.bin
        grub-mkrescue -o build/SSos.iso iso

    - name: Disponibilizar a ISO para Download (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: SSos-iso
        path: build/SSos.iso