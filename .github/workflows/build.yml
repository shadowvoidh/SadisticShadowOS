name: Build Kernel & ISO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o Código
      uses: actions/checkout@v4

    - name: Instalar Ferramentas
      run: |
        sudo apt update
        sudo apt install -y nasm build-essential gcc-multilib g++-multilib xorriso grub-pc-bin

    - name: Compilar o Kernel e Gerar a ISO
      run: |
        mkdir -p build iso/boot/grub
        nasm -f elf32 src/boot.asm -o build/boot.o
        g++ -m32 -c src/kernel.cpp -o build/kernel.o -ffreestanding -O2 -Wall -Wextra -fno-exceptions -fno-rtti
        ld -m elf_i386 -T linker.ld build/boot.o build/kernel.o -o build/myos.bin
        cp build/myos.bin iso/boot/myos.bin

        cat << 'EOF' > iso/boot/grub/grub.cfg
        set timeout=0
        set default=0
        menuentry "My OS" {
            multiboot /boot/myos.bin
            boot
        }
        EOF

        grub-mkrescue -o build/myos.iso iso

    - name: Disponibilizar a ISO para Download (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: myos-iso
        path: build/myos.iso

    - name: Instalar Ferramentas
      run: |
        sudo apt update
        sudo apt install -y nasm build-essential gcc-multilib g++-multilib xorriso grub-pc-bin